<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NoBreach Dashboard{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        html, body {
            overflow-x: hidden;
            max-width: 100vw;
            margin: 0;
            padding: 0;
        }
        /* Custom scrollbar for dark theme */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body class="bg-slate-800 text-gray-100 font-sans antialiased min-h-screen overflow-x-hidden">
    <!-- Sidebar -->
    <aside class="fixed inset-y-0 left-0 w-64 bg-slate-900 border-r border-slate-700 shadow-xl z-20 flex flex-col">
        <div class="h-16 flex items-center px-6 border-b border-slate-700 bg-slate-900/50">
            <span class="text-2xl mr-2">🛡️</span>
            <span class="text-xl font-bold tracking-wide text-gray-100"><span class="text-cyan-400">No</span>Breach Rulesmith</span>
        </div>
        
        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
            {% set active_page = active_page|default('home') %}
            
            <a href="/" class="flex items-center px-4 py-3 rounded-lg transition-colors {% if active_page == 'home' %}bg-slate-800 text-cyan-400 border-l-4 border-cyan-400{% else %}text-slate-300 hover:bg-slate-800 hover:text-white{% endif %}">
                <span class="mr-3 text-lg">🏠</span>
                <span class="font-medium">Home</span>
            </a>
            
            <a href="/scan" class="flex items-center px-4 py-3 rounded-lg transition-colors {% if active_page == 'scan' %}bg-slate-800 text-cyan-400 border-l-4 border-cyan-400{% else %}text-slate-300 hover:bg-slate-800 hover:text-white{% endif %}">
                <span class="mr-3 text-lg">🚀</span>
                <span class="font-medium">Scan</span>
            </a>
            
            <a href="/findings" class="flex items-center px-4 py-3 rounded-lg transition-colors {% if active_page == 'findings' %}bg-slate-800 text-cyan-400 border-l-4 border-cyan-400{% else %}text-slate-300 hover:bg-slate-800 hover:text-white{% endif %}">
                <span class="mr-3 text-lg">🔍</span>
                <span class="font-medium">Findings</span>
            </a>
            
            <a href="/remediation" class="flex items-center px-4 py-3 rounded-lg transition-colors {% if active_page == 'remediation' %}bg-slate-800 text-cyan-400 border-l-4 border-cyan-400{% else %}text-slate-300 hover:bg-slate-800 hover:text-white{% endif %}">
                <span class="mr-3 text-lg">✅</span>
                <span class="font-medium">Remediation</span>
            </a>
            
            <a href="/rules" class="flex items-center px-4 py-3 rounded-lg transition-colors {% if active_page == 'rules' %}bg-slate-800 text-cyan-400 border-l-4 border-cyan-400{% else %}text-slate-300 hover:bg-slate-800 hover:text-white{% endif %}">
                <span class="mr-3 text-lg">📋</span>
                <span class="font-medium">Rules</span>
            </a>
        </nav>
        
        <div class="p-4 border-t border-slate-700 text-xs text-slate-500 text-center">
            NoBreach Rulesmith &copy; 2026
        </div>
    </aside>

    <!-- Main Content -->
    <main class="ml-64 min-h-screen flex flex-col bg-slate-800 max-w-[calc(100vw-16rem)] overflow-x-hidden">
        <header class="h-16 flex items-center justify-between px-8 border-b border-slate-700 bg-slate-800/80 backdrop-blur sticky top-0 z-10">
            <h1 class="text-xl font-semibold text-gray-100">{% block title_header %}NoBreach Dashboard{% endblock %}</h1>
            <div class="flex items-center space-x-3">
                <button onclick="generateAndDownloadReport('html')" id="btn-export-html" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-cyan-600 hover:bg-cyan-500 text-white transition-colors flex items-center border border-cyan-400 shadow shadow-cyan-500/20 cursor-pointer">
                    <span class="mr-1.5">📄</span> Export HTML Report
                </button>
                <button onclick="generateAndDownloadReport('md')" id="btn-export-md" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-700 hover:bg-slate-600 text-slate-200 transition-colors flex items-center border border-slate-600 cursor-pointer">
                    <span class="mr-1.5">📝</span> Export Markdown
                </button>
            </div>
        </header>
        
        <div class="p-8 flex-1 w-full max-w-full overflow-x-hidden">
            {% block content %}{% endblock %}
        </div>
    </main>

    <script>
        async function generateAndDownloadReport(format) {
            const btn = format === 'html' ? document.getElementById('btn-export-html') : document.getElementById('btn-export-md');
            const origText = btn.innerHTML;
            btn.innerHTML = '<span class="animate-spin mr-1">⏳</span> Generating...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/report/generate', { method: 'POST' });
                if (res.ok) {
                    const data = await res.json();
                    const downloadUrl = format === 'md' ? data.md_url : data.html_url;
                    
                    // Trigger download
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    a.download = format === 'md' ? data.md_filename : data.html_filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                } else {
                    alert('Report generation failed. Check server logs.');
                }
            } catch(err) {
                console.error('Report export error:', err);
                alert('An error occurred while generating the report.');
            } finally {
                btn.innerHTML = origText;
                btn.disabled = false;
            }
        }
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
