- id: KB-011
  rule_ref: nb-insecure-deserialization-pickle
  name: Insecure Deserialization
  category: Software and Data Integrity Failures
  affected_technology: Python applications using pickle for serialization
  owasp_top10: A08:2021 — Software and Data Integrity Failures
  owasp_api: API8:2023 — Security Misconfiguration
  cwe: CWE-502 — Deserialization of Untrusted Data
  severity: Critical

  description: >
    The endpoint accepts a base64-encoded blob from the client and passes
    it directly to pickle.loads() for deserialization. Python's pickle
    format can encode arbitrary Python objects including those with custom
    __reduce__ methods that execute code during deserialization. An attacker
    who controls the pickle payload achieves arbitrary code execution at the
    moment the server calls pickle.loads().

  business_impact: >
    Insecure deserialization is reliably exploitable for remote code execution.
    A single crafted request can install a reverse shell, exfiltrate all
    application data and environment variables (including secrets), destroy
    data, or pivot to internal infrastructure — all without valid credentials.

  technical_impact: >
    Full remote code execution in the context of the application process.
    The attacker's code runs with the same permissions as the application,
    typically including filesystem access, environment variable access, and
    network access.

  detection_logic: >
    SAST: nb-insecure-deserialization-pickle detects calls to pickle.loads()
    or pickle.load() where the data argument is derived from a request object
    (request.json, request.data, request.get_json(), etc.) rather than a
    trusted, server-controlled source.

  remediation_steps:
    - Replace pickle.loads() with json.loads() for data interchange. JSON
      cannot encode executable code, so deserialization cannot execute
      attacker-controlled code.
    - If the use case genuinely requires a binary serialisation format,
      use msgpack or CBOR with a strict schema validator applied after
      deserialization.
    - If pickle is unavoidable for internal use (e.g. caching model objects),
      never accept pickle data from external HTTP clients. Sign internal pickle
      payloads with HMAC and verify the signature before calling pickle.loads().
    - Apply a minimal schema check immediately after JSON parsing: verify the
      top-level type, required keys, and value types before using any field.

  secure_coding_recommendation: >
    The rule is simple: never call pickle.loads() on data you did not create
    yourself on the same trusted system. Pickle is a code execution mechanism
    disguised as a serialisation format. Use data-only formats (JSON, YAML
    with safe_load, TOML) for any data that crosses a trust boundary.

  references:
    - https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/
    - https://cwe.mitre.org/data/definitions/502.html
    - https://docs.python.org/3/library/pickle.html#restricting-globals
