- id: NB-APPSEC-013
  name: Path Traversal via File Download Endpoint
  category: Access Control
  severity: High
  method: GET
  path: "/files/download?filename=../../../../etc/passwd"
  auth: none
  check_type: response_indicator
  expected_indicator: "root:"
  owasp: A01:2021
  cwe: CWE-22
  recommendation: >
    Strip directory traversal sequences using secure filename sanitization,
    resolve canonical absolute paths, and verify the resulting path is strictly
    confined within the intended root storage directory boundary.
